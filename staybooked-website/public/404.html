<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found | Stay Booked Marketing</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F4EE; color: #141414; font-family: 'DM Sans', Arial, sans-serif; }
    main { max-width: 560px; padding: 48px 24px; }
    .label { font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; color: #82683F; margin: 0 0 16px; }
    h1 { font-family: 'Archivo', Arial, sans-serif; font-weight: 800; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; margin: 0 0 16px; }
    p { font-size: 1.05rem; line-height: 1.6; margin: 0 0 32px; }
    .ctas { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
    .btn { display: inline-block; background: #141414; color: #F0EBE0; text-decoration: none; border-radius: 999px; padding: 16px 32px; font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .home { color: #141414; border-bottom: 1px solid #C9C2B4; text-decoration: none; padding-bottom: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="label">Page not found</p>
    <h1>This page doesn't exist.</h1>
    <p>The link may be old or mistyped. Here's where you can go from here.</p>
    <div class="ctas">
      <a class="btn" href="/book">Book a Free Call</a>
      <a class="home" href="/">Back to the homepage</a>
    </div>
  </main>
</body>
</html>
